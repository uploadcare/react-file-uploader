name: "Release and Publish Manual"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the versions to publish'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
      reason:
        description: 'Why this release was started (set by automation; leave empty for a manual release)'
        required: false
        default: ''
        type: string

# One release at a time: an automatic and a manual release would otherwise
# version the same commit and race to push their commits and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch's latest commit, not the one this run was queued on
          ref: ${{ github.ref }}

      - name: "Use Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "Install dependencies"
        working-directory: ./
        run: npm ci

      - name: "Run build"
        run: npx lerna run build

      - name: "Version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.environment }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          npx lerna version "$BUMP" --conventional-commits --yes

      # npm staged publishing needs npm >=11.15.0. Pin it after install/build so npm ci
      # https://github.com/npm/cli/issues/9722
      # keeps the dependency resolution the build was validated against.
      - name: "Pin npm with staged publishing support"
        run: npm install -g npm@11

      # Lerna has no native staged publishing, so replace `lerna publish from-git` with
      # `npm stage publish` per package, staging only the ones Lerna tagged on HEAD this run.
      - name: "Stage publish released packages"
        id: stage
        env:
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          npm config set //registry.npmjs.org/:_authToken="$NPM_TOKEN"
          released_tags="$(git tag --points-at HEAD)"
          lines=""
          count=0
          for dir in $(node -p "require('./package.json').workspaces.join(' ')"); do
            pkg="$dir/package.json"
            [ "$(node -p "require('./$pkg').private === true")" = "true" ] && continue
            name="$(node -p "require('./$pkg').name")"
            version="$(node -p "require('./$pkg').version")"
            if echo "$released_tags" | grep -qxF "${name}@${version}"; then
              echo "Staging ${name}@${version}"
              ( cd "$dir" && npm stage publish )
              lines="${lines}• <https://www.npmjs.com/package/${name}?activeTab=staged|${name}@${version}>"$'\n'
              count=$((count + 1))
            else
              echo "Skipping ${name}@${version} (not released in this run)"
            fi
          done
          {
            echo "count=${count}"
            echo "message<<SLACK_EOF"
            if [ -n "$REASON" ]; then
              printf ':robot_face: Automatic release: %s\n' "$REASON"
            fi
            printf ':package: Staged for review (2FA required to approve each):\n%s' "$lines"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Notify Slack about staged release"
        if: steps.stage.outputs.count != '0'
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_NPM_RELEASE_CHANNEL }}
          slack-message: ${{ steps.stage.outputs.message }}

      - name: "Notify Slack about a failed release"
        if: failure()
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_NPM_RELEASE_CHANNEL }}
          slack-message: |
            :x: Release and Publish Manual (${{ github.event.inputs.environment }}) failed${{ github.event.inputs.reason && format(' — automatic release: {0}', github.event.inputs.reason) || '' }}.
            Nothing may have been staged; check whether a version was tagged before rerunning: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>
