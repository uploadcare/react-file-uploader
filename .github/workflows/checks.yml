name: "Checks"

on:
  pull_request:
  push:
    branches:
      - main
  # Called by bump-file-uploader.yml on the bump branch: its PR is opened with
  # GITHUB_TOKEN, which doesn't trigger pull_request runs.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out"
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: ./
        run: npm i
      - name: Run build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests (React 18 and 19)
        run: npm test
      - name: Build
        run: npm run build
      - name: Run e2e apps (React 18 and 19)
        run: npm run test:e2e
